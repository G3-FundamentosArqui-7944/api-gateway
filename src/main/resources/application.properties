spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Spring Cloud Gateway corre sobre WebFlux. El buffer de codecs limita
# uploads multipart (por defecto 256KB). Lo subimos a 256MB para que pasen
# videos sin truncar al rutear a videos-service.
spring.codec.max-in-memory-size=256MB
spring.cloud.gateway.httpserver.wiretap=false
spring.cloud.gateway.httpclient.response-timeout=300s
spring.cloud.gateway.httpclient.connect-timeout=10000

# IAM service
spring.cloud.gateway.routes[0].id=iam-service
spring.cloud.gateway.routes[0].uri=lb://iam-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/authentication/**, /api/v1/users/**, /api/v1/roles/**

# Matchmaking service
spring.cloud.gateway.routes[1].id=matchmaking-service
spring.cloud.gateway.routes[1].uri=lb://matchmaking-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/athletes/**, /api/v1/coaches/**, /api/v1/connection-requests/**, /api/v1/training-sessions/**

# Membership service
spring.cloud.gateway.routes[2].id=membership-service
spring.cloud.gateway.routes[2].uri=lb://membership-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/membership-plans/**, /api/v1/subscriptions/**, /api/v1/payments/**

# Nutrition service
spring.cloud.gateway.routes[3].id=nutrition-service
spring.cloud.gateway.routes[3].uri=lb://nutrition-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/meals/**, /api/v1/nutrition-plans/**, /api/v1/nutrition-analyses/**

# Training service
spring.cloud.gateway.routes[4].id=training-service
spring.cloud.gateway.routes[4].uri=lb://training-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/workout-sessions/**, /api/v1/performance-metrics/**

# Videos service
spring.cloud.gateway.routes[5].id=videos-service
spring.cloud.gateway.routes[5].uri=lb://videos-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/exercise-videos/**

# Swagger consolidado
spring.cloud.gateway.routes[6].id=iam-docs
spring.cloud.gateway.routes[6].uri=lb://iam-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/v3/api-docs/iam
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/v3/api-docs/iam, /v3/api-docs

spring.cloud.gateway.routes[7].id=matchmaking-docs
spring.cloud.gateway.routes[7].uri=lb://matchmaking-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/v3/api-docs/matchmaking
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/v3/api-docs/matchmaking, /v3/api-docs

spring.cloud.gateway.routes[8].id=membership-docs
spring.cloud.gateway.routes[8].uri=lb://membership-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/v3/api-docs/membership
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/v3/api-docs/membership, /v3/api-docs

spring.cloud.gateway.routes[9].id=nutrition-docs
spring.cloud.gateway.routes[9].uri=lb://nutrition-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/v3/api-docs/nutrition
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/v3/api-docs/nutrition, /v3/api-docs

spring.cloud.gateway.routes[10].id=training-docs
spring.cloud.gateway.routes[10].uri=lb://training-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/v3/api-docs/training
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/v3/api-docs/training, /v3/api-docs

spring.cloud.gateway.routes[11].id=videos-docs
spring.cloud.gateway.routes[11].uri=lb://videos-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/v3/api-docs/videos
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/v3/api-docs/videos, /v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=IAM Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/iam
springdoc.swagger-ui.urls[1].name=Matchmaking Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/matchmaking
springdoc.swagger-ui.urls[2].name=Membership Service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/membership
springdoc.swagger-ui.urls[3].name=Nutrition Service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/nutrition
springdoc.swagger-ui.urls[4].name=Training Service
springdoc.swagger-ui.urls[4].url=/v3/api-docs/training
springdoc.swagger-ui.urls[5].name=Videos Service
springdoc.swagger-ui.urls[5].url=/v3/api-docs/videos

management.endpoints.web.exposure.include=*
